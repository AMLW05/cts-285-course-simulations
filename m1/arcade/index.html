<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Analyst — CTS-285 Module 1 Arcade</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --edge:#2b3441;
  --ink:#e6edf3; --dim:#8b949e; --accent:#7dd8ff; --good:#3fb950; --bad:#f85149;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  line-height:1.55;padding:24px 16px 64px}
main{max-width:840px;margin:0 auto}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* --- the narrator. A layer, not a scoreboard: it reacts, it never tallies. --- */
.dm{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--edge);
  border-radius:10px;padding:14px 16px;margin-bottom:18px}
.dm .face{flex:0 0 auto;width:54px;height:54px;border-radius:8px;background:#0b1220;border:1px solid var(--edge);
  display:grid;place-items:center;font-family:var(--mono);font-size:1.5rem;color:var(--accent)}
.dm[data-mood="HAPPY"] .face{color:var(--good)}
.dm[data-mood="GLITCH"] .face{color:var(--bad)}
.dm[data-mood="SMUG"] .face,.dm[data-mood="OVERCLOCK"] .face{color:#ffd479}
.dm .line{flex:1 1 auto;min-width:0}
.dm .who{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 4px}
.dm .say{margin:0;font-size:1rem}

h1{font-size:1.5rem;margin:0 0 4px}
h2{font-size:1.15rem;margin:0 0 10px}
.sub{color:var(--dim);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:16px 18px;margin:0 0 14px}
.prompt{background:var(--panel2);border-left:4px solid var(--accent);padding:14px 16px;border-radius:0 8px 8px 0;margin:0 0 6px}
.src{font-family:var(--mono);font-size:.76rem;color:var(--dim);margin:0 0 14px}
.quotes{display:grid;gap:10px;margin:0 0 14px}
.quotes div{background:var(--panel2);border:1px solid var(--edge);border-radius:8px;padding:10px 12px;font-size:.92rem}
.quotes b{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.opts{display:grid;gap:8px}
button.opt{text-align:left;background:var(--panel2);color:var(--ink);border:1px solid var(--edge);
  border-radius:8px;padding:12px 14px;font:inherit;cursor:pointer;min-height:44px}
button.opt:hover{border-color:var(--accent)}
button.opt[disabled]{cursor:default;opacity:.75}
button.opt[data-state="right"]{border-color:var(--good);background:#10251a}
button.opt[data-state="chosen-wrong"]{border-color:var(--bad);background:#2a1416}
.fb{margin:14px 0 0;padding:14px 16px;border-radius:8px;background:var(--panel2);border-left:4px solid var(--dim)}
.fb[data-w="correct"]{border-left-color:var(--good)}
.fb[data-w="wrong"]{border-left-color:var(--bad)}
.verdict{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.btn{background:var(--accent);color:#04222e;border:0;border-radius:8px;padding:11px 18px;font:inherit;
  font-weight:600;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--edge)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stations{display:grid;gap:10px}
button.station{text-align:left;background:var(--panel);border:1px solid var(--edge);border-radius:10px;
  padding:14px 16px;color:var(--ink);font:inherit;cursor:pointer}
button.station:hover{border-color:var(--accent)}
button.station .nm{font-weight:600;display:block}
button.station .bl{color:var(--dim);font-size:.9rem;display:block;margin-top:2px}
button.station .st{font-family:var(--mono);font-size:.72rem;color:var(--dim);display:block;margin-top:8px}
/* --- the case file: the run compounds into something you keep --- */
.case{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:14px 16px;margin-top:18px}
.case h3{margin:0 0 8px;font-size:.78rem;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.case ol{margin:0;padding-left:20px}
.case li{margin:0 0 6px;font-size:.92rem}
.case li[data-w="wrong"]{color:var(--dim)}
textarea{width:100%;min-height:220px;background:#0b1220;color:var(--ink);border:1px solid var(--edge);
  border-radius:8px;padding:12px;font-family:var(--mono);font-size:.84rem;line-height:1.5}
table{width:100%;border-collapse:collapse;margin:0 0 8px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--edge);font-size:.92rem}
th{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:400}
.foot{color:var(--dim);font-size:.8rem;margin-top:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<p class="sr" id="live" role="status" aria-live="polite"></p>
<script>
const b = s => btoa(unescape(encodeURIComponent(s)));
const u = s => decodeURIComponent(escape(atob(s)));

const STATIONS = [
  {id:"signal", name:"Sort the Signal", ask:"Which analyst category is this line evidence of?", blurb:"Every line in a manual is evidence of something. Naming which kind is the first move.", optionSet:["PURPOSE","USERS & ROLES","INPUTS","PROCESSING","OUTPUTS","FEEDBACK"]},
  {id:"verdict", name:"Observation or Assumption", ask:"Can you point at the sentence, or are you adding it?", blurb:"An observation can be quoted. An assumption cannot. The difference is the job.", optionSet:["Observation","Assumption"]},
  {id:"evidence", name:"Check the Citation", ask:"Would this hold up in your case file?", blurb:"A quote without its source is not evidence. Neither is a paraphrase.", optionSet:["Counts as evidence","Not evidence"]},
  {id:"register", name:"Catch the Contradiction", ask:"The two registers disagree. What is the strongest finding?", blurb:"The Story and the Operating Notes do not always agree. Silence in one is not silence in the manual."}
];

const ITEMS = [
  {id:"s01", station:"signal", prompt:"DataMan™ was designed with the help of educators to help provide fun, drill and practice with numbers.", answer:b("PURPOSE"), why:"This is a claim about why the product exists, not about what happens when you press a key. That's Purpose — keep it out of Processing.", source:"The Story of DataMan (Narrative)"},
  {id:"s02", station:"signal", prompt:"You, one of your friends, or Mom or Dad can put up to ten problems in my memory bank.", answer:b("USERS & ROLES"), why:"Two roles are named without ever using the word \"role\": the person loading problems (friend, Mom, or Dad) and the person solving them later are not the same job.", source:"Memory Bank (Story)"},
  {id:"s03", station:"signal", prompt:"DataMan will only accept problems with one or two digit numbers. Answers can be one, two, or three digits.", answer:b("INPUTS"), why:"A limit on what the system will accept before it does anything with it — an Input constraint.", source:"Answer Checker (Operating Notes)"},
  {id:"s04", station:"signal", prompt:"DataMan is not built to handle negative numbers and will not accept subtraction problems that would result in a negative answer.", answer:b("PROCESSING"), why:"This is a rule the system applies to what you enter, not the entering itself — that's Processing.", source:"Answer Checker (Operating Notes)"},
  {id:"s05", station:"signal", prompt:"After 10 problems, two numbers are displayed: 8   10 — Number of right answers · Number of problems tried.", answer:b("OUTPUTS"), why:"Information the system hands back to the user at the end of a run — an Output.", source:"Answer Checker (Operating Notes)"},
  {id:"s06", station:"signal", prompt:"If the answer is right, DataMan will flash his display. If the answer is wrong, EEE is displayed, followed by a random blinking pattern.", answer:b("FEEDBACK"), why:"Not the score itself — this is how the system reacts to each try, right then. That reaction is Feedback.", source:"Answer Checker (Operating Notes)"},
  {id:"s07", station:"signal", prompt:"The other team presses my ON key, and my Electro Flash key, and selects a math table for you to practice. You then press GO, and solve the problems I pop up.", answer:b("USERS & ROLES"), why:"One role picks the table and sets up the turn; a different role — the batter — solves it. Same device, two jobs.", source:"Space Ball (continued) · Game Board"},
  {id:"s08", station:"signal", prompt:"DataMan measures time in \"ticks of his Atom Clock.\" The actual speed of his clock may vary depending on how fresh the battery is, room temperature, etc.", answer:b("PROCESSING"), why:"A rule about how the system's own internal measurement behaves, not what it displays — that's Processing, not Output.", source:"Memory Bank (Operating Notes) · DataMan's Timer"},
  {id:"v01", station:"verdict", prompt:"DataMan has a key labeled MEMORY BANK.", answer:b("Observation"), why:"Directly stated: \"You enter and store problems with the [MEMORY BANK] key.\" — Memory Bank (Operating Notes) · DataMan's Timer. You can point right at the sentence."},
  {id:"v02", station:"verdict", prompt:"Kids like Electro Flash better than Answer Checker.", answer:b("Assumption"), why:"The manual never compares the two activities by preference. There's nothing to point to — this is a guess dressed as a fact."},
  {id:"v03", station:"verdict", prompt:"After ten problems, Answer Checker shows a score.", answer:b("Observation"), why:"\"After you try ten problems, I'll put your score in lights with two numbers like this: 9   10\" — Please Try Me Out · Score · Division · Turning Off."},
  {id:"v04", station:"verdict", prompt:"Playing Electro Flash makes children faster at math facts than any other method.", answer:b("Assumption"), why:"The manual claims Electro Flash players get \"lightning fast\" — but it never compares that result to any other method. That comparison is something you'd be adding, not reporting."},
  {id:"v05", station:"verdict", prompt:"Force Out will not accept 0 as a move.", answer:b("Observation"), why:"Stated in DataMan's own voice: \"I won't let you put in a zero!\" — Force Out (Story)."},
  {id:"v06", station:"verdict", prompt:"The Wipe Out timer runs the same length every game.", answer:b("Assumption"), why:"The opposite is built in on purpose: the cutoff is \"selected at random by DataMan... and is known only to him.\" Treat a claim of sameness here as unsupported."},
  {id:"v07", station:"verdict", prompt:"DataMan's Timer counts in seconds.", answer:b("Assumption"), why:"The manual names a specific, different unit — \"ticks\" of the Atom Clock — and says its real-world speed varies. Swapping in \"seconds\" is a small, easy-to-miss assumption."},
  {id:"v08", station:"verdict", prompt:"TI recommends a 9-volt alkaline battery for DataMan.", answer:b("Observation"), why:"Stated directly, word for word: \"A standard 9-volt alkaline battery is recommended for maximum DataMan operating time.\" — Appendix."},
  {id:"e01", station:"evidence", prompt:"Case file entry — quote: \"DataMan keeps score.\" Cited as: page 20.", answer:b("Not evidence"), why:"The section heading is the citation, not the page. This manual has two page-numbering systems that disagree — write \"Answer Checker (Operating Notes)\" instead."},
  {id:"e02", station:"evidence", prompt:"Case file entry — quote: \"After 10 problems, two numbers are displayed: 8   10.\" Cited as: Answer Checker (Operating Notes).", answer:b("Counts as evidence"), why:"Exact quoted phrase, plus the section heading by name. That's what evidence looks like."},
  {id:"e03", station:"evidence", prompt:"Case file entry: \"The Memory Bank lets more than one person load problems.\" No exact phrase quoted.", answer:b("Not evidence"), why:"A fair reading — but it's a paraphrase. Quote it: \"You, one of your friends, or Mom or Dad can put up to ten problems in my memory bank.\""},
  {id:"e04", station:"evidence", prompt:"Case file entry — quote: \"I won't let you put in a zero!\" Cited as: Force Out (Story).", answer:b("Counts as evidence"), why:"Exact wording, named section. Counts."},
  {id:"e05", station:"evidence", prompt:"Open question logged: \"What happens after two wrong tries in Answer Checker?\"", answer:b("Not evidence"), why:"Answered directly: \"If after two tries the answer entered is still wrong, DataMan will display the problem with the correct result.\" — Answer Checker (Operating Notes). Check before you log it."},
  {id:"e06", station:"evidence", prompt:"Open question logged: \"How many ticks of the Atom Clock equal one real second?\"", answer:b("Counts as evidence"), why:"Genuinely open. The manual only says the clock's \"actual speed... may vary depending on how fresh the battery is, room temperature, etc.\" — no fixed conversion is ever given."},
  {id:"e07", station:"evidence", prompt:"Open question logged: \"Does Wipe Out reveal the answer after two misses?\" — checked Operating Notes only, which is silent.", answer:b("Not evidence"), why:"Operating Notes are silent, but the Story is not: \"If you miss the problem twice, I'll answer the problem for you.\" — Wipe Out (Story). A silence in one register is not a silence in the manual — check both before you log an Unknown."},
  {id:"e08", station:"evidence", prompt:"Open question logged: \"What brand of 9-volt battery works best, beyond alkaline?\"", answer:b("Counts as evidence"), why:"The Appendix names the battery type (alkaline) and nothing more specific. Genuinely unanswered."},
  {id:"r01", station:"register", prompt:"What's the strongest finding here?", answer:b("The two registers disagree on direction, and the Story's own worked examples actually follow the Operating Notes' order — even the Story contradicts itself"), why:"The Story's prose says left-to-right; the Story's own examples move right → left → middle, matching Operating Notes exactly. The real finding isn't \"left to right\" — it's that the prose and the examples in the same section disagree.", source:"Missing Number \"Box\" Problems (Story) vs Missing Number (Box) Problems (Operating Notes)", options:["Trust the Story's prose — it's simpler","The two registers disagree on direction, and the Story's own worked examples actually follow the Operating Notes' order — even the Story contradicts itself","This is unimportant and can be skipped"], left:"Missing Number \"Box\" Problems (Story)", right:"Missing Number (Box) Problems (Operating Notes)", quote1:"Keep pressing the key until the box stops where you want to put your answer in the problem... 4 × 3 = [?]  or  [?] × 3 = 12  or  4 × [?] = 12", quote2:"The box [ ] appears at the right side of the problem... Pressing [?] again moves the box to the left side... Pressing [?] once more moves the box to the middle."},
  {id:"r02", station:"register", prompt:"What's the safest finding to record?", answer:b("The starting number varies between examples, and Operating Notes confirms it changes \"a different one each time\""), why:"Two different worked numbers plus an explicit statement that it changes — record the rule, not either example number.", source:"Force Out (Story) vs Wipe Out (continued) · Force Out · Missing Number (Operating Notes)", options:["The starting number is always 37","The starting number is always 63","The starting number varies between examples, and Operating Notes confirms it changes \"a different one each time\""], left:"Force Out (Story)", right:"Wipe Out (continued) · Force Out · Missing Number (Operating Notes)", quote1:"I'll pick a number to start the game and show it to you like this: 37 − [ ] =", quote2:"DataMan will display a number (a different one each time) like this: 63 − [ ] ="},
  {id:"r03", station:"register", prompt:"Operating Notes never say what happens after two misses. What goes in the case file?", answer:b("Record the finding anyway, citing Wipe Out (Story) — and note in Section 9 that Operating Notes are silent on this point"), why:"Part I answers this even though Part II doesn't. Use the register that has the evidence, and put the disagreement itself in the Cross-Register Note.", source:"Wipe Out (Story) vs Wipe Out (Operating Notes)", options:["Log it as an Unknown, since Operating Notes never confirm it","Record the finding anyway, citing Wipe Out (Story) — and note in Section 9 that Operating Notes are silent on this point","Leave it out of the case file entirely"], left:"Wipe Out (Story)", right:"Wipe Out (Operating Notes)", quote1:"If you miss the problem twice, I'll answer the problem for you."},
  {id:"r04", station:"register", prompt:"The Story never mentions these limits at all. What does that mean for an analyst?", answer:b("A real content gap: a reader of only Part I would build an incomplete picture of what Answer Checker actually accepts"), why:"Neither register is complete on its own. This is exactly why Section 9 asks for a cross-register note, not just a two-column comparison.", source:"Answer Checker (Story) / Please Try Me Out vs Answer Checker (Operating Notes)", options:["The limits must not really exist, since the Story would mention anything important","A real content gap: a reader of only Part I would build an incomplete picture of what Answer Checker actually accepts","It's a manual error — delete the Operating Notes rule"], left:"Answer Checker (Story) / Please Try Me Out", right:"Answer Checker (Operating Notes)", quote2:"DataMan will only accept problems with one or two digit numbers... will not accept subtraction problems that would result in a negative answer."},
  {id:"r05", station:"register", prompt:"If your assigned feature were one of these six games, what would Section 9 say?", answer:b("Part I is your only source, and the Cross-Register Note records that Operating Notes are silent on the feature entirely"), why:"A one-sided feature is still a finding worth naming — silence itself is evidence of how this manual is organized.", source:"Starmath Race · Orbit Math! · First Out! · Space Ball! · Astro Race · Antimath Maze vs Operating Notes", options:["Skip Section 9 — there's nothing to compare","Part I is your only source, and the Cross-Register Note records that Operating Notes are silent on the feature entirely","Write your own Operating Notes rules to fill the gap"], left:"Starmath Race · Orbit Math! · First Out! · Space Ball! · Astro Race · Antimath Maze", right:"Operating Notes", quote1:"Six named games, each with its own Story section."}
];

const BOOT = [
  {title:"Two registers, one manual.", text:"This manual documents DataMan twice. Part I is the Story — first person, illustrated, written for a child. Part II is the Operating Notes — third person, a reference for adults. Neither half is complete. Your case file, and every station ahead, has to draw from both."},
  {title:"", text:""},
  {title:"Observation, not assumption.", text:"The professional rule: if you cannot point to evidence that supports a conclusion, do not record it as a fact. Call it an assumption, or say more information is needed. Every station ahead runs on this one rule."},
  {title:"", text:""},
  {title:"The four moves.", text:"Observe: read without jumping to conclusions. Identify: find the evidence for Purpose, Users, Inputs, Processing, Outputs, Feedback. Verify: support every conclusion with a quote. Document: record only what you know, and name what you don't. That's the whole process — every station ahead is one of these moves."},
  {title:"Why Number Guesser isn't in this game.", text:"Every station ahead pulls from Answer Checker, Memory Bank, Electro Flash, Wipe Out, Force Out, and Missing Number \"Box\" Problems — never Number Guesser. That feature is your solo case file. This game trains the moves. It doesn't hand you the findings."}
];
</script>
<script>
/* ---- store: cumulative only. runs and best accrue and never break. ---- */
const KEY = "cts285.arcade.m1";
const Store = {
  read(){ try{ const r = localStorage.getItem(KEY); if(!r) return null;
    const d = JSON.parse(r); return d && d.v === 2 ? d : null; }catch(e){ return null; } },
  write(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} },
  clear(){ try{ localStorage.removeItem(KEY); }catch(e){} }
};
let mem = Store.read() || { v:2, stations:{} };
const save = () => Store.write(mem);
const rec = id => (mem.stations[id] = mem.stations[id] || { runs:0, best:0 });

const app  = document.getElementById("app");
const live = document.getElementById("live");
const say  = t => { live.textContent = ""; setTimeout(() => { live.textContent = t; }, 40); };
const esc  = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const stationById = id => STATIONS.find(s => s.id === id);
const itemsFor = id => ITEMS.filter(i => i.station === id);
function shuffle(a){ const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r; }

const S = { screen:"title", station:null, queue:[], idx:0, answered:false,
            results:[], bootIdx:0, bootAnswered:null, mood:"IDLE", says:"" };

/* ---- the narrator. It reacts to the move you just made and says what the
   move established. It never keeps score: the case file does that. ---- */
const FACE = { IDLE:"◠◠", SCAN:"▚▚", HAPPY:"◡◡", SMUG:"◔◔", GLITCH:"✕✕", OVERCLOCK:"▲▲" };
function narrate(mood, line){ S.mood = mood; S.says = line; }

function dmBlock(){
  return '<div class="dm" data-mood="' + esc(S.mood) + '">'
    + '<div class="face" aria-hidden="true">' + (FACE[S.mood] || FACE.IDLE) + '</div>'
    + '<div class="line"><p class="who">DataMan</p><p class="say">' + esc(S.says) + '</p></div></div>';
}

/* ---- screens ---- */
function screenTitle(){
  narrate("IDLE", "Field Analyst online. Two registers, one manual, and a case file to keep.");
  return dmBlock()
    + '<h1>Field Analyst</h1>'
    + '<p class="sub">CTS-285 Module 1 &middot; four stations, one habit each. '
    + 'Nothing here is graded and nothing is submitted.</p>'
    + '<div class="card"><p style="margin:0 0 10px">You read the 1977 DataMan manual the way an analyst '
    + 'reads any system document: sort the signal, tell observation from assumption, check what you can '
    + 'actually cite, and catch the manual disagreeing with itself.</p>'
    + '<p style="margin:0;color:var(--dim)">No clock. No lives. No score to lose. Each answer adds a line '
    + 'to your case file, and you leave with the case file.</p></div>'
    + '<div class="row"><button class="btn" data-act="boot">Start the prelude</button>'
    + '<button class="btn ghost" data-act="select">Skip to the stations</button></div>';
}

function screenBoot(){
  const c = BOOT[S.bootIdx];
  const isAsk = !!c.opts;
  let h = dmBlock() + '<h2>Prelude &middot; ' + (S.bootIdx + 1) + ' of ' + BOOT.length + '</h2>';
  if (!isAsk) {
    narrate("SCAN", "Read this before the shift. The prelude teaches; the stations only ask.");
    h += '<div class="card"><h2>' + esc(c.title) + '</h2><p style="margin:0">' + esc(c.text) + '</p></div>'
       + '<div class="row"><button class="btn" data-act="bootnext">Continue</button></div>';
    return h;
  }
  h += '<div class="card"><div class="prompt">' + esc(c.q) + '</div><div class="opts">'
     + c.opts.map((o,i) => '<button class="opt" data-boot="' + i + '"'
        + (S.bootAnswered === null ? "" : " disabled")
        + (S.bootAnswered === null ? "" :
            (i === c.ans ? ' data-state="right"' : (i === S.bootAnswered ? ' data-state="chosen-wrong"' : "")))
        + '>' + esc(o) + '</button>').join("") + '</div>';
  if (S.bootAnswered !== null) {
    const ok = S.bootAnswered === c.ans;
    h += '<div class="fb" data-w="' + (ok ? "correct" : "wrong") + '">'
       + '<p class="verdict">' + (ok ? "That is the habit" : "Not the habit") + '</p>'
       + '<p style="margin:6px 0 0">' + esc(c.why) + '</p></div>'
       + '<div class="row"><button class="btn" data-act="bootnext">Continue</button></div>';
  }
  return h + '</div>';
}

function screenSelect(){
  narrate("IDLE", "Pick a station. Each one is a different habit, and you can take them in any order.");
  const cards = STATIONS.map(st => {
    const r = mem.stations[st.id] || { runs:0, best:0 };
    const n = itemsFor(st.id).length;
    return '<button class="station" data-go="' + esc(st.id) + '">'
      + '<span class="nm">' + esc(st.name) + '</span>'
      + '<span class="bl">' + esc(st.blurb) + '</span>'
      + '<span class="st">' + n + ' items &middot; runs ' + r.runs + ' &middot; best ' + r.best + '/' + n + '</span>'
      + '</button>';
  }).join("");
  return dmBlock() + '<h1>Four stations</h1><p class="sub">Runs and best only ever go up. '
    + 'Leaving costs you nothing.</p><div class="stations">' + cards + '</div>'
    + '<div class="row"><button class="btn ghost" data-act="title">Back</button>'
    + '<button class="btn ghost" data-act="wipe">Clear progress</button></div>';
}

function optionsFor(st, it){ return it.options || st.optionSet; }

function screenPlay(){
  const st = S.station, it = S.queue[S.idx], opts = optionsFor(st, it);
  const answer = u(it.answer);
  let h = dmBlock() + '<h2>' + esc(st.name) + '</h2>'
    + '<p class="sub">' + (S.idx + 1) + ' of ' + S.queue.length + ' &middot; ' + esc(st.ask) + '</p>';
  h += '<div class="card"><div class="prompt">' + esc(it.prompt) + '</div>';
  if (it.source) h += '<p class="src">' + esc(it.source) + '</p>';
  if (it.quote1 || it.quote2) {
    h += '<div class="quotes">';
    if (it.quote1) h += '<div><b>' + esc(it.left) + '</b>' + esc(it.quote1) + '</div>';
    if (it.quote2) h += '<div><b>' + esc(it.right) + '</b>' + esc(it.quote2) + '</div>';
    if (!it.quote1) h += '<div><b>' + esc(it.left) + '</b>No corresponding passage. The silence is the finding.</div>';
    if (!it.quote2) h += '<div><b>' + esc(it.right) + '</b>No corresponding passage. The silence is the finding.</div>';
    h += '</div>';
  }
  h += '<div class="opts">' + opts.map(o =>
      '<button class="opt" data-opt="' + esc(o) + '"' + (S.answered ? " disabled" : "")
      + (S.answered ? (o === answer ? ' data-state="right"'
          : (o === S.chosen ? ' data-state="chosen-wrong"' : "")) : "")
      + '>' + esc(o) + '</button>').join("") + '</div>';
  if (S.answered) {
    const ok = S.chosen === answer;
    h += '<div class="fb" data-w="' + (ok ? "correct" : "wrong") + '">'
       + '<p class="verdict">' + (ok ? "Held up" : "Does not hold") + '</p>'
       + '<p style="margin:6px 0 0">' + esc(it.why) + '</p></div>'
       + '<div class="row"><button class="btn" data-act="next">'
       + (S.idx + 1 < S.queue.length ? "Next" : "Close the file") + '</button></div>';
  }
  h += '</div>';
  return h + caseBlock();
}

/* ---- the case file. This is the compounding: each answer adds a line, the
   lines are the run, and the run is something you take away. ---- */
function caseBlock(){
  if (!S.results.length) return "";
  return '<div class="case"><h3>Case file &middot; ' + S.results.length + ' entr'
    + (S.results.length === 1 ? "y" : "ies") + '</h3><ol>'
    + S.results.map(r => '<li data-w="' + (r.ok ? "correct" : "wrong") + '">'
        + esc(r.line) + '</li>').join("") + '</ol></div>';
}

function caseMarkdown(){
  const st = S.station;
  const right = S.results.filter(r => r.ok).length;
  const out = ["# Field Analyst — case file", "",
    "**Station:** " + st.name, "**Kept:** " + right + " of " + S.results.length, "",
    "| # | Entry | Held up |", "|---|---|---|"];
  S.results.forEach((r, i) => out.push("| " + (i+1) + " | " + r.line.replace(/\|/g, "\\|")
    + " | " + (r.ok ? "yes" : "no") + " |"));
  out.push("", "_Nothing here is graded. Carry the entries that held up into your guided document analysis._");
  return out.join("\n");
}

function screenDebrief(){
  const st = S.station, right = S.results.filter(r => r.ok).length, n = S.results.length;
  const r = rec(st.id);
  r.runs += 1;
  r.best = Math.max(r.best, right);
  r.lastMissed = S.results.filter(x => !x.ok).map(x => x.id);
  save();
  const missed = S.results.filter(x => !x.ok);
  narrate(missed.length ? "SCAN" : "HAPPY",
    missed.length ? "Some entries did not hold. Those are the ones worth rereading."
                  : "Every entry held. The case file is clean.");
  let h = dmBlock() + '<h1>' + esc(st.name) + '</h1>'
    + '<p class="sub">' + right + ' of ' + n + ' entries held &middot; best ' + r.best + '/' + n
    + ' &middot; run ' + r.runs + '</p>';
  h += '<div class="card"><table><thead><tr><th>Entry</th><th>Held up</th></tr></thead><tbody>'
    + S.results.map(x => '<tr><td>' + esc(x.line) + '</td><td>' + (x.ok ? "yes" : "no") + '</td></tr>').join("")
    + '</tbody></table></div>';
  if (missed.length) {
    h += '<div class="card"><h2>Reread these</h2>'
      + missed.map(x => '<p style="margin:0 0 10px"><strong>' + esc(x.line) + '</strong><br>'
          + esc(x.why) + '</p>').join("") + '</div>';
  }
  h += '<div class="card"><h2>Take the case file with you</h2>'
    + '<p style="margin:0 0 10px;color:var(--dim)">Copy this into your notes. The entries that held up are '
    + 'the ones you can cite in your guided document analysis.</p>'
    + '<textarea id="md" readonly aria-label="Case file as Markdown">' + esc(caseMarkdown()) + '</textarea>'
    + '<div class="row"><button class="btn" data-act="copy">Copy Markdown</button>'
    + '<button class="btn ghost" data-act="again">Run it again</button>'
    + '<button class="btn ghost" data-act="select">Other stations</button></div></div>';
  return h + '<p class="foot">Nothing here is graded, nothing is submitted, and your progress stays in '
    + 'this browser.</p>';
}

/* ---- flow ---- */
function startStation(id){
  const st = stationById(id); if (!st) return go("select");
  S.station = st; S.queue = shuffle(itemsFor(id)); S.idx = 0;
  S.answered = false; S.chosen = null; S.results = [];
  narrate("SCAN", st.ask);
  S.screen = "play"; render();
}
function answer(chosen){
  if (S.answered) return;
  const it = S.queue[S.idx], ok = chosen === u(it.answer);
  S.answered = true; S.chosen = chosen;
  S.results.push({ id: it.id, ok, line: it.prompt.length > 96
    ? it.prompt.slice(0, 93) + "…" : it.prompt, why: it.why });
  narrate(ok ? "HAPPY" : "GLITCH",
    ok ? "That one you can point at." : "You cannot point at that. Read the why.");
  render(); say(ok ? "Held up." : "Does not hold.");
}
function advance(){
  if (S.idx + 1 < S.queue.length) { S.idx++; S.answered = false; S.chosen = null;
    narrate("IDLE", S.station.ask); }
  else S.screen = "debrief";
  render();
}
function go(screen){ S.screen = screen; render(); }

function render(){
  app.innerHTML = S.screen === "title"   ? screenTitle()
                : S.screen === "boot"    ? screenBoot()
                : S.screen === "select"  ? screenSelect()
                : S.screen === "play"    ? screenPlay()
                :                          screenDebrief();
  wire();
  const f = app.querySelector("button.opt:not([disabled]), .btn");
  if (f) f.focus();
}

function wire(){
  app.querySelectorAll("[data-act]").forEach(el => el.addEventListener("click", () => {
    const a = el.getAttribute("data-act");
    if (a === "boot")     { S.bootIdx = 0; S.bootAnswered = null; go("boot"); }
    if (a === "bootnext") { S.bootAnswered = null;
                            if (S.bootIdx + 1 < BOOT.length) { S.bootIdx++; render(); } else go("select"); }
    if (a === "select" || a === "title") go(a);
    if (a === "next")   advance();
    if (a === "again")  startStation(S.station.id);
    if (a === "copy")   copyMd(el);
    if (a === "wipe")   { if (confirm("Clear runs and best for every station?")) {
                            Store.clear(); mem = { v:2, stations:{} }; render(); } }
  }));
  app.querySelectorAll("[data-go]").forEach(el =>
    el.addEventListener("click", () => startStation(el.getAttribute("data-go"))));
  app.querySelectorAll("[data-opt]").forEach(el =>
    el.addEventListener("click", () => answer(el.getAttribute("data-opt"))));
  app.querySelectorAll("[data-boot]").forEach(el =>
    el.addEventListener("click", () => {
      if (S.bootAnswered !== null) return;
      S.bootAnswered = parseInt(el.getAttribute("data-boot"), 10);
      const c = BOOT[S.bootIdx];
      narrate(S.bootAnswered === c.ans ? "HAPPY" : "SCAN",
        S.bootAnswered === c.ans ? "Right. That is the habit the stations will ask for."
                                 : "Not yet. Read the why — the prelude is where this is free.");
      render();
    }));
}

function copyMd(btn){
  const t = document.getElementById("md"); if (!t) return;
  t.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch(e) { ok = false; }
  if (!ok && navigator.clipboard) {
    navigator.clipboard.writeText(t.value).then(() => { btn.textContent = "Copied"; });
    return;
  }
  btn.textContent = ok ? "Copied" : "Select all and copy";
  setTimeout(() => { btn.textContent = "Copy Markdown"; }, 1800);
}

render();

</script>
