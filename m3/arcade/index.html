<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BACKLOG BENCH — Product Work Survey</title>
<style>
/* Light, not the DataMan device. M2's cabinet is about the artefact; M3 is
   about the work done to it. Palette matches the M3 simulations so a student
   moving between them stays in one visual register. */
:root{
  --bg:#f7fafc; --panel:#ffffff; --panel-2:#eef3f8; --line:#cbd5e1; --line-dim:#e2e8f0;
  --ink:#1f2933; --dim:#5b6b7c; --navy:#1f4e79; --teal:#2c7a7b; --gold:#b7791f;
  --go:#2f855a; --go-bg:#e9f5ee; --near:#b7791f; --near-bg:#fdf5e6;
  --early:#c05621; --early-bg:#fdf0e6; --halt:#c53030; --halt-bg:#fdecec;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:22px 16px 64px}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 .3rem}
h1{font-size:1.5rem;line-height:1.2;margin:0 0 .5rem;color:var(--navy)}
h2{font-size:1.02rem;margin:1.4rem 0 .6rem;color:var(--navy)}
p{margin:0 0 .9rem}
.rule{height:4px;background:var(--navy);border:0;margin:0 0 1.4rem}

button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink)}
button:hover:not(:disabled){background:var(--panel-2);border-color:var(--navy)}
button:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
button:disabled{cursor:default}
.btn{padding:.7rem 1.1rem;min-height:44px}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.btn-primary:hover{background:#173d5e;border-color:#173d5e}
.btn-row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem}
.stationcard{display:block;width:100%;text-align:left;padding:1rem 1.1rem;margin:0 0 .7rem;min-height:44px}
.stationcard .nm{font-weight:700;color:var(--navy)}
.stationcard .sub{color:var(--dim);font-size:.92rem}
.stationcard .stat{font-family:var(--mono);font-size:.72rem;color:var(--dim);margin-top:.35rem;display:block}

fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;width:100%}
.mlotag{display:inline-block;font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--teal);border:1px solid var(--line);border-radius:3px;
  padding:.15rem .45rem;margin:0 0 .6rem;background:var(--panel)}
.prompt{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--navy);
  border-radius:0 6px 6px 0;padding:1.1rem 1.2rem;margin:0 0 1.1rem;font-size:1.04rem}
.opt{display:block;width:100%;text-align:left;padding:.8rem 1rem;margin:0 0 .55rem;min-height:44px}
.opt .glyph{font-family:var(--mono);font-weight:700;margin-right:.6rem;color:var(--dim)}
.opt[data-state="correct"]{background:var(--go-bg);border-color:var(--go)}
.opt[data-state="near"]{background:var(--near-bg);border-color:var(--near)}
.opt[data-state="early"]{background:var(--early-bg);border-color:var(--early)}
.opt[data-state="wrong"]{background:var(--halt-bg);border-color:var(--halt)}
.opt[data-chosen="1"]{box-shadow:inset 4px 0 0 var(--ink)}

/* Ordering mode. M3's judgments are relational: what goes first, what waits on
   what. Multiple choice asks students to recognise an order somebody else made.
   Picking one at a time makes them make it — and makes a dependency arrive as a
   consequence rather than as a fact on a page.
   Sequential buttons, not drag and drop: fully keyboard operable. */
.slots{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1rem}
.slot{flex:1 1 8rem;min-height:44px;border:1px dashed var(--line);border-radius:6px;
  padding:.5rem .7rem;font-size:.82rem;color:var(--dim);background:var(--panel)}
.slot[data-filled="1"]{border-style:solid;border-color:var(--navy);color:var(--ink);background:var(--panel-2)}
.slot b{display:block;font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--teal)}

.fb{border:1px solid var(--line);border-left-width:5px;border-radius:0 6px 6px 0;
  padding:1rem 1.1rem;margin:1.1rem 0 0;background:var(--panel)}
.fb[data-w="correct"]{border-left-color:var(--go)}
.fb[data-w="near"]{border-left-color:var(--near)}
.fb[data-w="early"]{border-left-color:var(--early)}
.fb[data-w="wrong"]{border-left-color:var(--halt)}
.fb .verdict{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
  display:inline-block;padding:.2rem .55rem;border-radius:3px;margin:0 0 .5rem;color:#fff}
.v-correct{background:var(--go)} .v-near{background:var(--near)}
.v-early{background:var(--early)} .v-wrong{background:var(--halt)}
.fb p{margin:0}

.meter{font-family:var(--mono);font-size:.72rem;color:var(--dim);letter-spacing:.08em;margin:0 0 1rem}
.mlorow{display:flex;justify-content:space-between;gap:1rem;border:1px solid var(--line);
  border-radius:6px;padding:.7rem .9rem;margin:0 0 .55rem;background:var(--panel)}
.mlorow .lbl{color:var(--navy)}
.mlorow .sc{font-family:var(--mono);color:var(--dim)}
.mlorow[data-weak="1"]{border-color:var(--gold);border-left-width:5px}
.missed{border-left:3px solid var(--line);padding-left:1rem;margin:0 0 1.1rem}
.missed .q{color:var(--navy);margin:0 0 .3rem;font-weight:600}
.missed .a{color:var(--dim);font-size:.92rem;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line-dim);padding:0 0 .7rem;margin:0 0 1.3rem}
.rank{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;color:var(--teal);text-transform:uppercase}
.minibtn{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;padding:.4rem .7rem;
  text-transform:uppercase;min-height:44px}

.present .prompt{font-size:1.85rem;line-height:1.3;padding:1.5rem 1.6rem}
.present .opt{font-size:1.3rem;padding:1rem 1.2rem}
.present .fb{font-size:1.2rem}
.present .slot{font-size:1.05rem}
.present .hint{font-family:var(--mono);font-size:.9rem;color:var(--dim)}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (max-width:640px){ .wrap{padding:14px 12px 48px} h1{font-size:1.22rem}
  .present .prompt{font-size:1.3rem} .present .opt{font-size:1.05rem} }
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <div id="live" class="sr" aria-live="polite" role="status"></div>
  <main id="app"></main>
</div>

<script>
"use strict";
/* ============================================================================
   BANK — content authors edit ONLY this object.

   Two item types:
     (default)      one prompt, one answer, feedback on every option
     type:"order"   pick items in sequence; feedback per pick; sequence[] holds
                    the defensible order

   weight ∈ correct | near | early | wrong. "near" is a defensible reading and
   is NOT scored against the student — three bands, matching the green / yellow
   / red relevance scale in the M1 cabinet. There is rarely a 100% answer to a
   product decision.

   TWO PRODUCTS, ON PURPOSE.
     DataMan   — the 1977 TI math-drill toy, modernized. The course project.
     ADS       — Algorithmic Data Solutions Ltd., a corporate records platform.
   They are deliberately unalike in every way that is supposed to matter:
   audience, stakes, budget, complexity. They fail identically. That is the
   lesson — analysis difficulty does not scale with a system's importance, so
   the judgment has to be human either way.
   ========================================================================= */
const b = s => btoa(s), u = s => atob(s);

const MLOS = {
  "3.1":"Develop actionable product work",
  "3.2":"Analyze backlog readiness",
  "3.3":"Prioritize and defend"
};

const BANK = {
  cabinet:"m3", title:"Backlog Bench", subtitle:"Product Work Survey",
  stations:[{
    id:"bench", name:"The Bench", subtitle:"Eighteen items across all three outcomes.",
    runLength:18,
    items:[

  /* ---------------- MLO 3.1 · stories and criteria ---------------- */
  {id:"b01", mlo:"3.1", prompt:"Which story keeps the value where it belongs?", answer:b("b"),
   options:[{id:"a",label:"As a developer, I want a retry button so that I can add retry functionality."},
            {id:"b",label:"As a learner, I want another attempt after a wrong answer so that I can correct my work."},
            {id:"c",label:"As a product owner, I want retry implemented so that the backlog item closes."},
            {id:"d",label:"As a teacher, I want the system improved so that children enjoy it more."}],
   feedback:{
     b:{weight:b("correct"), text:"A real user, a real capability, and a reason that survives the feature being built differently."},
     a:{weight:b("wrong"), text:"The developer is not who receives value. The “so that” restates the “I want”, which is the tell."},
     c:{weight:b("wrong"), text:"Closing a backlog item is process, not value. Nobody outside the team benefits from this sentence."},
     d:{weight:b("near"), text:"Right seat, real need, and far too broad to be one story. This is an epic in story clothing."}}},

  {id:"b02", mlo:"3.1", prompt:"Ship it as one story, or split it? “As an operator, I want to search, add, edit, delete, validate, and export ADS records so that I can manage all customer information.”", answer:b("a"),
   options:[{id:"a",label:"Split — six verbs is six stories."},
            {id:"b",label:"Ship — it names one user and one goal."},
            {id:"c",label:"Split, but only into read operations and write operations."},
            {id:"d",label:"Ship — splitting would lose the operator's overall need."}],
   feedback:{
     a:{weight:b("correct"), text:"Count the children under “I want”. More than one and it is an epic, whatever the sentence looks like."},
     b:{weight:b("wrong"), text:"One user, yes. One goal, no — six capabilities are hiding behind the word “manage”."},
     c:{weight:b("near"), text:"A defensible axis, and it stops halfway. Export and validate are not the same work as read."},
     d:{weight:b("near"), text:"The overall need is real and it belongs in an epic that the stories trace back to. It is not lost by splitting; it is recorded above them."}}},

  {id:"b03", mlo:"3.1", prompt:"Which is an acceptance criterion rather than a design decision?", answer:b("c"),
   options:[{id:"a",label:"The retry button is green and sits below the answer field."},
            {id:"b",label:"Attempts are stored in a SQLite table named attempts."},
            {id:"c",label:"After an incorrect answer the learner is offered another attempt before the answer is shown."},
            {id:"d",label:"The retry experience feels encouraging."}],
   feedback:{
     c:{weight:b("correct"), text:"Observable, testable, and silent about how it is built."},
     a:{weight:b("early"), text:"Colour and position are design. They may be decided later and they are not the condition for done."},
     b:{weight:b("early"), text:"Storage is implementation. The criterion is what the learner experiences."},
     d:{weight:b("wrong"), text:"Nobody can test “feels encouraging”. It is a hope, not a criterion."}}},

  {id:"b04", mlo:"3.1", prompt:"Given a learner has answered incorrectly once — which Then makes the story testable?", answer:b("b"),
   options:[{id:"a",label:"Then the system responds appropriately."},
            {id:"b",label:"Then the correct answer is not displayed and a second attempt is accepted."},
            {id:"c",label:"Then the learner feels supported."},
            {id:"d",label:"Then the system logs the attempt for later analysis."}],
   feedback:{
     b:{weight:b("correct"), text:"Two observable conditions, both checkable in one pass."},
     a:{weight:b("wrong"), text:"“Appropriately” moves the whole judgment into the tester's head."},
     c:{weight:b("wrong"), text:"A feeling is an outcome you might design for. It is not a Then."},
     d:{weight:b("near"), text:"Perfectly testable, and it is a different requirement. Logging is not what this story promised the learner."}}},

  {id:"b05", mlo:"3.1", prompt:"A story arrives with no requirement ID behind it. What does that tell the product owner?", answer:b("c"),
   options:[{id:"a",label:"Nothing — traceability is paperwork."},
            {id:"b",label:"It is invalid and should be deleted."},
            {id:"c",label:"Somebody wanted it. Whether anybody needs it is still unestablished."},
            {id:"d",label:"The requirements register is incomplete and should be updated to match."}],
   feedback:{
     c:{weight:b("correct"), text:"An untraceable story is a preference until proven otherwise. That is not a reason to bin it, and it is a reason to ask."},
     d:{weight:b("early"), text:"Backfilling the register to justify a story you already like is how assumptions become requirements. Ask first."},
     a:{weight:b("wrong"), text:"Traceability is what lets you answer “why does this exist” in week nine."},
     b:{weight:b("near"), text:"Too fast. It may be a real need nobody wrote down yet — which is a gap in the register, discovered honestly."}}},

  {id:"b06", mlo:"3.1", prompt:"ADS: “As a compliance officer, I want the audit trail improved so that we pass review.” DataMan: “As a teacher, I want the score display improved so that children are motivated.” What do these two share?", answer:b("d"),
   options:[{id:"a",label:"Nothing — one is regulated enterprise work, the other is a toy."},
            {id:"b",label:"Both are non-functional requirements."},
            {id:"c",label:"Both are missing acceptance criteria."},
            {id:"d",label:"Both hide an undefined word — improved — that decides the whole scope."}],
   feedback:{
     d:{weight:b("correct"), text:"Different stakes, identical defect. Analysis difficulty does not scale with how important the system is, which is exactly why it needs a person."},
     c:{weight:b("near"), text:"True of both, and downstream. You cannot write criteria until somebody says what improved means."},
     a:{weight:b("wrong"), text:"The contrast is the point. A regulated platform and a children's toy fail the same way here."},
     b:{weight:b("wrong"), text:"Neither is a requirement of any kind yet."}}},

  /* ---------------- MLO 3.2 · backlog readiness ---------------- */
  {id:"b07", mlo:"3.2", prompt:"Which item is NOT ready for team consideration?", answer:b("b"),
   options:[{id:"a",label:"Learner can submit an answer and receive correctness feedback. Criteria written. Traced to FR-01."},
            {id:"b",label:"Make the practice session adaptive. Nobody has defined adaptive. Traced to nothing."},
            {id:"c",label:"Score persists between sessions. Criteria written. Depends on accounts, which is in the backlog."},
            {id:"d",label:"Keyboard-only operation throughout. Criteria written. Traced to NFR-02."}],
   feedback:{
     b:{weight:b("correct"), text:"Undefined and untraced. A team cannot size it, build it, or tell when it is done."},
     c:{weight:b("near"), text:"A known dependency does not make an item unready — it makes it ordered. Ready and next are different questions."},
     a:{weight:b("wrong"), text:"Defined, traced, testable."},
     d:{weight:b("wrong"), text:"Same — and “throughout” is scoped by the criteria beneath it."}}},

  {id:"b08", mlo:"3.2", prompt:"Two stories are both sized Medium. What does that mean?", answer:b("c"),
   options:[{id:"a",label:"They will both take about the same number of days."},
            {id:"b",label:"They are both medium priority."},
            {id:"c",label:"Compared with the rest of this backlog, the team expects similar effort."},
            {id:"d",label:"They are both about twice the size of a Smaller item."}],
   feedback:{
     c:{weight:b("correct"), text:"Relative sizing compares work against other work on the same board. It says nothing about a calendar."},
     d:{weight:b("near"), text:"The instinct to make it arithmetic is the risk. Smaller, Medium and Larger are buckets, not multiples."},
     a:{weight:b("wrong"), text:"The moment a size becomes days it stops being an estimate and starts being a promise."},
     b:{weight:b("wrong"), text:"Effort and priority are independent. A cheap item can be worthless and an expensive one urgent."}}},

  {id:"b09", mlo:"3.2", prompt:"The team cannot agree on a size: half say Smaller, half say Larger. What is the most useful reading?", answer:b("b"),
   options:[{id:"a",label:"Call it Medium and move on."},
            {id:"b",label:"The spread is evidence of uncertainty, not of disagreement about effort."},
            {id:"c",label:"Take the highest, to be safe."},
            {id:"d",label:"The story is too large and must be split."}],
   feedback:{
     b:{weight:b("correct"), text:"When people who understand the work estimate this differently, they are holding different pictures of what it is. Find out which before sizing again."},
     d:{weight:b("near"), text:"Often true and it is the second move. Splitting an item nobody understands yet produces smaller items nobody understands."},
     a:{weight:b("wrong"), text:"Splitting the difference erases the signal. The size was never the valuable part of the conversation."},
     c:{weight:b("early"), text:"Padding hides the uncertainty instead of resolving it, and it is invisible to everyone downstream."}}},

  {id:"b10", mlo:"3.2", prompt:"“Score persists between sessions” depends on “Learner accounts exist”. Which statement is correct?", answer:b("a"),
   options:[{id:"a",label:"Accounts must be ordered before persistence, whatever their relative value."},
            {id:"b",label:"Persistence should go first because it has higher value to learners."},
            {id:"c",label:"They can be built in parallel by different people."},
            {id:"d",label:"The dependency means persistence should be cut from this release."}],
   feedback:{
     a:{weight:b("correct"), text:"Dependencies override value in ordering. This is the case where the lower-value item correctly goes first, and it is the only one."},
     b:{weight:b("wrong"), text:"Value decides what is worth doing. It does not decide what is possible to do first."},
     c:{weight:b("near"), text:"Sometimes true with a stub or an agreed interface. As stated, the dependency is real and parallel work carries the risk of building against something that changes."},
     d:{weight:b("early"), text:"A dependency is a sequencing fact. Cutting is a separate decision needing its own reason."}}},

  {id:"b11", mlo:"3.2", prompt:"A story reads: “As a learner, I want the whole practice experience to be better.” The team sizes it Larger and looks uneasy. What is the actual problem?", answer:b("c"),
   options:[{id:"a",label:"Larger is too big for one sprint."},
            {id:"b",label:"The team is being pessimistic."},
            {id:"c",label:"A number was put on something nobody has defined."},
            {id:"d",label:"It needs acceptance criteria before sizing."}],
   feedback:{
     c:{weight:b("correct"), text:"21 here is not an estimate. It is the team saying “we do not know” in a format that looks like knowing."},
     d:{weight:b("near"), text:"Correct next step, and it addresses a symptom. Criteria cannot be written for a statement this vague either."},
     a:{weight:b("near"), text:"True and beside the point. Splitting an undefined thing produces smaller undefined things."},
     b:{weight:b("wrong"), text:"They are being honest. Unease is the only signal available to them."}}},

  {id:"b12", mlo:"3.2", prompt:"ADS: “Improve report generation performance.” Sized Larger, no criteria, no baseline measurement. What does that size rest on?", answer:b("b"),
   options:[{id:"a",label:"The team's experience with similar work."},
            {id:"b",label:"An assumption about which report and how much faster, that nobody has stated."},
            {id:"c",label:"The complexity of the reporting subsystem."},
            {id:"d",label:"Nothing — the item should not have been sized at all."}],
   feedback:{
     b:{weight:b("correct"), text:"Same defect as the DataMan item, in an enterprise system with a budget. Nobody said which report or what target, so the size prices a guess."},
     d:{weight:b("near"), text:"Defensible, and a little absolute. A rough size can be useful for a conversation as long as everyone knows what it rests on."},
     a:{weight:b("near"), text:"Probably what they used, and experience of what? The work has not been specified."},
     c:{weight:b("wrong"), text:"Complexity of a subsystem is not the same as scope of a change to it."}}},

  /* ---------------- MLO 3.3 · prioritize and defend ---------------- */
  {id:"b13", mlo:"3.3", type:"order", picks:2,
   prompt:"Sprint planning. Capacity is 8 points. Choose what goes first, then second.",
   cards:[{id:"acct",label:"Learner accounts exist — 3 pts, low learner value, blocks persistence"},
          {id:"pers",label:"Score persists between sessions — 3 pts, high learner value"},
          {id:"anim",label:"Celebration animation on a perfect run — 2 pts, delights, blocks nothing"},
          {id:"rept",label:"Teacher progress report — 8 pts, high teacher value, needs persistence"}],
   sequence:[b("acct"), b("pers")],
   feedback:{
     acct:[{weight:b("correct"), text:"Correct, and it is the uncomfortable one. Accounts have the lowest learner value on this board and they go first because two other items cannot exist without them."},
           {weight:b("near"), text:"Still defensible in second place if you took a cheap win first. It has to land before persistence either way."}],
     pers:[{weight:b("early"), text:"Highest learner value, and it cannot be built — accounts do not exist yet. Value tells you what is worth doing, not what is possible to do now."},
           {weight:b("correct"), text:"Correct. Accounts unblocked it, and now it is the highest value item the team can actually finish."}],
     anim:[{weight:b("near"), text:"A real choice, not a wrong one. Two points, blocks nothing, and it delights — but taking it first means the sprint's value depends on what fits after it."},
           {weight:b("near"), text:"Defensible. You have 3 points left after accounts and this fits where persistence also would. Persistence carries more."}],
     rept:[{weight:b("wrong"), text:"Eight points is the entire sprint, and it needs persistence, which needs accounts. Neither exists."},
           {weight:b("wrong"), text:"Still blocked, and still the whole capacity."}]},
   close:"Dependencies decide order. Value decides what is worth ordering. Capacity decides how much of the order you get this time."},

  {id:"b14", mlo:"3.3", prompt:"You ordered an item first and wrote: \u201cIt unblocks two other items and reaches the sprint goal we agreed.\u201d Which lens is that reason using?", answer:b("c"),
   options:[{id:"a",label:"Value \u2014 it matters most to users."},
            {id:"b",label:"Relative effort \u2014 it is the smallest."},
            {id:"c",label:"Dependency, against an agreed goal."},
            {id:"d",label:"Risk \u2014 it reduces the most uncertainty."}],
   feedback:{
     c:{weight:b("correct"), text:"Naming the lens is what makes a reason checkable. Unblocking is dependency; the sprint goal is the agreement it serves. Someone can now argue with the reasoning instead of with you."},
     a:{weight:b("near"), text:"Value is probably behind the goal, and the sentence does not claim it. The reason given is about what the item enables, not who wants it."},
     d:{weight:b("near"), text:"Unblocking work does reduce schedule risk, so this is defensible. Dependency is the more direct reading of what the sentence actually says."},
     b:{weight:b("wrong"), text:"Nothing in the reason mentions size. Smallest-first is a different argument, and a weaker one."}}},


  {id:"b15", mlo:"3.3", prompt:"You defer an item. What makes deferral a decision rather than a delay?", answer:b("b"),
   options:[{id:"a",label:"Telling the stakeholder it is still in the backlog."},
            {id:"b",label:"Recording what would have to change for it to move forward."},
            {id:"c",label:"Assigning it a lower priority label."},
            {id:"d",label:"Moving it below the capacity line."}],
   feedback:{
     b:{weight:b("correct"), text:"A deferral with a named condition can be revisited by anyone. Without one it is an item quietly ageing at the bottom."},
     c:{weight:b("near"), text:"Labels record the outcome and not the reasoning. In six weeks the label says what, not why."},
     d:{weight:b("near"), text:"That is the mechanic of deferring. The decision is the sentence you write next to it."},
     a:{weight:b("wrong"), text:"Reassurance is not a record. Everything is still in the backlog."}}},

  {id:"b16", mlo:"3.3", type:"order", picks:2,
   prompt:"ADS release planning. Capacity is 10 points. Choose first, then second.",
   cards:[{id:"aud",label:"Audit log write path — 5 pts, regulatory deadline in six weeks"},
          {id:"srch",label:"Faster record search — 5 pts, most-requested by operators"},
          {id:"exp",label:"CSV export — 3 pts, one team's workaround removal"},
          {id:"dash",label:"Operations dashboard — 8 pts, executive request, no stated need"}],
   sequence:[b("aud"), b("srch")],
   feedback:{
     aud:[{weight:b("correct"), text:"A regulatory deadline is a constraint, not a preference. It is the one item on this board where being late has a defined external cost."},
          {weight:b("near"), text:"Six weeks gives you room to take it second. It is a risk you are choosing to carry, so say so out loud."}],
     srch:[{weight:b("near"), text:"Most-requested is real evidence of value and it has no deadline. Taking it first means betting the audit work fits after — a bet worth stating."},
           {weight:b("correct"), text:"Correct. The constraint is handled and this is the highest-value item the remaining capacity can hold."}],
     exp:[{weight:b("near"), text:"Cheap and it removes a workaround, which is genuine value. It does not reach the deadline or the top request."},
          {weight:b("near"), text:"Three points fits beside the audit work. Search carries more and also fits."}],
     dash:[{weight:b("wrong"), text:"Eight of ten points on a request with no stated need. Executive interest is not evidence — it is a reason to go and elicit one."},
           {weight:b("wrong"), text:"Same problem, and now it will not fit."}]},
   close:"Same board shape as the DataMan sprint, different stakes. A deadline behaves like a dependency: it removes a choice you thought you had."},

  {id:"b17", mlo:"3.3", prompt:"Halfway through the sprint a stakeholder brings new information that changes an item's value. What does a product owner do?", answer:b("a"),
   options:[{id:"a",label:"Re-evaluate the item, and record what changed and why."},
            {id:"b",label:"Hold the plan — the sprint was committed."},
            {id:"c",label:"Swap it immediately for the next item down."},
            {id:"d",label:"Wait for the retro to raise it."}],
   feedback:{
     a:{weight:b("correct"), text:"Revising on evidence is the job. Revising without recording it is how a team loses the ability to explain its own backlog."},
     b:{weight:b("near"), text:"Protecting a sprint from churn is a real and defensible discipline. Protecting it from evidence is not — the distinction is whether anything actually changed."},
     c:{weight:b("early"), text:"Fast, and it skips the part where you establish that the new information is real."},
     d:{weight:b("wrong"), text:"The retro examines how the team worked. It is not where a live decision is made."}}},

  {id:"b18", mlo:"3.3", prompt:"Which of these belongs in a backlog decision record?", answer:b("d"),
   options:[{id:"a",label:"The final priority order."},
            {id:"b",label:"The story point totals per sprint."},
            {id:"c",label:"Who attended the planning session."},
            {id:"d",label:"What was rejected, and the reason it was rejected."}],
   feedback:{
     d:{weight:b("correct"), text:"The order is visible in the backlog. Why the alternative lost is visible nowhere else, and it is the part somebody will question in six weeks."},
     a:{weight:b("near"), text:"Worth capturing as context and it duplicates the tool. Records earn their keep by holding what the tool cannot."},
     b:{weight:b("wrong"), text:"Metrics, not reasoning."},
     c:{weight:b("near"), text:"Useful provenance for who to ask later. Not the decision."}}}
    ]
  }]
};

const RANKS=["Trainee","Product Analyst","Product Owner","Lead PO","Principal"];
const VERDICT_WORD={correct:"Strong",near:"Useful",early:"Too early",wrong:"Not this one"};
const VERDICT_GLYPH={correct:"✓",near:"△",early:"○",wrong:"✕"};

const KEY="cts285.arcade."+BANK.cabinet;
const Store={
  read(){ try{const r=localStorage.getItem(KEY); if(!r)return null;
    const d=JSON.parse(r); return d&&d.v===1?d:null;}catch(e){return null;} },
  write(d){ try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){} },
  clear(){ try{localStorage.removeItem(KEY);}catch(e){} }
};
let mem=Store.read()||{v:1,rank:0,stations:{}};
const save=()=>{ if(!S.present) Store.write(mem); };

const params=new URLSearchParams(location.search);
const S={screen:"boot",present:params.get("present")==="1",
  station:null,queue:[],idx:0,missed:[],near:[],answered:false,
  order:{picked:[],step:0}};

const app=document.getElementById("app"), live=document.getElementById("live");
const say=t=>{live.textContent="";setTimeout(()=>{live.textContent=t;},40);};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stationById=id=>BANK.stations.find(s=>s.id===id);
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

function bar(){ if(S.present) return "";
  return '<div class="bar"><span class="rank">Rank &middot; '+esc(RANKS[mem.rank]||RANKS[0])+'</span>'
    +'<span><button class="minibtn" id="wipe">Clear progress</button></span></div>'; }

function renderMenu(){
  S.screen="menu";
  const cards=BANK.stations.map(st=>{
    const rec=mem.stations[st.id]||{runs:0,best:0};
    return '<button class="stationcard" data-go="'+st.id+'"><span class="nm">'+esc(st.name)+'</span><br>'
      +'<span class="sub">'+esc(st.subtitle)+'</span>'
      +'<span class="stat">runs '+rec.runs+' &middot; best '+rec.best+'/'+st.runLength+'</span></button>';
  }).join("");
  app.innerHTML=bar()+'<p class="eyebrow">'+esc(BANK.title)+'</p><h1>'+esc(BANK.subtitle)+'</h1><hr class="rule">'
    +'<p>Eighteen items on turning requirements into product work. Nothing here is graded and nothing is submitted.</p>'
    +'<p>Two products appear throughout: the DataMan modernization, and Algorithmic Data Solutions Ltd. They are unalike in every way that is supposed to matter. They fail the same way.</p>'
    +'<p>The debrief names your weakest outcome, while there is still time to revise <code>docs/product-backlog.md</code>.</p>'+cards;
  document.body.classList.remove("present"); wire();
}

function startStation(id){
  const st=stationById(id); if(!st) return renderMenu();
  S.station=st; S.queue=shuffle(st.items).slice(0,Math.min(st.runLength,st.items.length));
  S.idx=0; S.missed=[]; S.near=[]; renderItem();
}

function renderItem(){
  S.screen="play"; S.answered=false; S.order={picked:[],step:0};
  const it=S.queue[S.idx];
  app.innerHTML=bar()
    +(S.present?'':'<p class="meter">item '+(S.idx+1)+' of '+S.queue.length+'</p>')
    +'<fieldset><legend><span class="mlotag">MLO '+esc(it.mlo)+' &middot; '+esc(MLOS[it.mlo])+'</span>'
    +'<div class="prompt">'+esc(it.prompt)+'</div></legend>'
    +(it.type==="order"?slots(it):'')
    +'<div id="opts">'+optionButtons(it)+'</div></fieldset><div id="fb"></div>'
    +(S.present?'<p class="hint">Space or &rarr; reveals &middot; &larr; &rarr; move &middot; Esc exits</p>':'');
  document.body.classList.toggle("present",S.present); wire();
  const f=app.querySelector(".opt"); if(f&&!S.present) f.focus();
}

function slots(it){
  let h='<div class="slots">';
  for(let i=0;i<it.picks;i++){
    const p=S.order.picked[i];
    const card=p?it.cards.find(c=>c.id===p):null;
    h+='<div class="slot"'+(card?' data-filled="1"':'')+'><b>'+(i===0?"First":"Then")+'</b>'
      +(card?esc(card.label.split(" — ")[0]):"—")+'</div>';
  }
  return h+'</div>';
}

function optionButtons(it){
  if(it.type==="order"){
    const left=it.cards.filter(c=>!S.order.picked.includes(c.id));
    return shuffle(left).map(c=>'<button class="opt" data-opt="'+esc(c.id)+'">'
      +'<span class="glyph" aria-hidden="true">&middot;</span>'+esc(c.label)+'</button>').join("");
  }
  return shuffle(it.options).map(o=>'<button class="opt" data-opt="'+esc(o.id)+'">'
    +'<span class="glyph" aria-hidden="true">&middot;</span>'+esc(o.label)+'</button>').join("");
}

function fbBlock(w,text,btn){
  return '<div class="fb" data-w="'+w+'"><span class="verdict v-'+w+'">'+esc(VERDICT_WORD[w])+'</span>'
    +'<p>'+esc(text)+'</p></div>'
    +(S.present||!btn?'':'<div class="btn-row"><button class="btn btn-primary" id="next">'+btn+'</button></div>');
}

function answer(chosen){
  const it=S.queue[S.idx];
  if(it.type==="order") return answerOrder(chosen);
  if(S.answered) return; S.answered=true;
  const correct=u(it.answer);
  it.options.forEach(o=>{
    const btn=app.querySelector('.opt[data-opt="'+o.id+'"]'); if(!btn) return;
    const w=u(it.feedback[o.id].weight);
    btn.dataset.state=w; btn.disabled=true;
    if(chosen&&o.id===chosen) btn.dataset.chosen="1";
    btn.querySelector(".glyph").textContent=VERDICT_GLYPH[w];
  });
  const shown=chosen||correct, w=u(it.feedback[shown].weight);
  document.getElementById("fb").innerHTML=fbBlock(w,it.feedback[shown].text,
    S.idx+1<S.queue.length?"Next":"Finish");
  if(chosen){
    if(chosen===correct){} else if(w==="near"){S.near.push({it,chosen});} else {S.missed.push({it,chosen});}
    say(VERDICT_WORD[w]+". "+it.feedback[shown].text);
  }
  wire(); const nb=document.getElementById("next"); if(nb) nb.focus();
}

/* Ordering: one pick per step, feedback per step, the board reshapes.
   A dependency is learned by hitting it, not by reading that it exists. */
function answerOrder(chosen){
  const it=S.queue[S.idx], step=S.order.step;
  if(!chosen) chosen=u(it.sequence[step]);
  const w=u(it.feedback[chosen][step].weight);
  S.order.picked.push(chosen); S.order.step++;
  if(w!=="correct"&&w!=="near") S.missed.push({it,chosen});
  else if(w==="near") S.near.push({it,chosen});

  const last=S.order.step>=it.picks;
  const text=it.feedback[chosen][step].text+(last?"  "+it.close:"");
  app.querySelector(".slots").outerHTML=slots(it);
  document.getElementById("opts").innerHTML=last?"":optionButtons(it);
  document.getElementById("fb").innerHTML=fbBlock(w,text,last?(S.idx+1<S.queue.length?"Next":"Finish"):null);
  say(VERDICT_WORD[w]+". "+text);
  if(last) S.answered=true;
  wire();
  const nb=document.getElementById("next")||app.querySelector(".opt"); if(nb&&!S.present) nb.focus();
}

function advance(){ if(S.idx+1<S.queue.length){S.idx++;renderItem();} else renderDebrief(); }

function renderDebrief(){
  S.screen="debrief";
  const st=S.station, score=S.queue.length-S.missed.length;
  const rec=mem.stations[st.id]||{runs:0,best:0};
  rec.runs+=1; rec.best=Math.max(rec.best,score); mem.stations[st.id]=rec;
  mem.rank=Math.min(RANKS.length-1,Math.floor(rec.best/4)); save();

  const seen={},hit={};
  S.queue.forEach(it=>{seen[it.mlo]=(seen[it.mlo]||0)+1;});
  S.queue.forEach(it=>{if(!S.missed.some(m=>m.it.id===it.id))hit[it.mlo]=(hit[it.mlo]||0)+1;});
  const rates=Object.keys(MLOS).map(k=>({k,got:hit[k]||0,of:seen[k]||0}));
  const weak=rates.filter(r=>r.of).sort((a,c)=>(a.got/a.of)-(c.got/c.of))[0];
  const breakdown=rates.filter(r=>r.of).map(r=>'<div class="mlorow"'
    +(weak&&r.k===weak.k&&r.got<r.of?' data-weak="1"':'')+'><span class="lbl">MLO '+esc(r.k)
    +' &middot; '+esc(MLOS[r.k])+'</span><span class="sc">'+r.got+'/'+r.of+'</span></div>').join("");
  const steer=(weak&&weak.got<weak.of)
    ?'<p>Weakest outcome this run: <strong>MLO '+esc(weak.k)+' &mdash; '+esc(MLOS[weak.k])
      +'</strong>. Reread that section before you revise <code>docs/product-backlog.md</code>.</p>'
    :'<p>Even across all three outcomes. Take the backlog to the Backlog Review and check it against the six lenses.</p>';
  const nearNote=S.near.length?'<p class="meter">'+S.near.length+' defensible near-miss'
    +(S.near.length===1?'':'es')+' &mdash; not counted against you. Read why the other reading is stronger.</p>':'';

  const list=S.missed.length?S.missed.map(m=>{
    const it=m.it;
    const label=it.type==="order"
      ? (it.cards.find(c=>c.id===m.chosen)||{label:m.chosen}).label
      : (it.options.find(o=>o.id===u(it.answer))||{label:""}).label;
    const why=it.type==="order"
      ? it.close
      : it.feedback[u(it.answer)].text;
    return '<div class="missed"><p class="q">[MLO '+esc(it.mlo)+'] '+esc(it.prompt)+'</p>'
      +'<p class="a">'+esc(label)+' &mdash; '+esc(why)+'</p></div>';
  }).join(""):'<p>Nothing missed.</p>';

  app.innerHTML=bar()+'<p class="eyebrow">Debrief</p><h1>The Bench</h1><hr class="rule">'
    +'<p class="meter">'+score+' of '+S.queue.length+' &middot; best '+rec.best+' &middot; rank '+esc(RANKS[mem.rank])+'</p>'
    +'<h2>By outcome</h2>'+breakdown+steer+nearNote
    +'<h2>Run it back on these</h2>'+list
    +'<div class="btn-row"><button class="btn btn-primary" id="again">Run it back</button>'
    +'<button class="btn" id="menu">Main menu</button></div>';
  say("Debrief. "+score+" of "+S.queue.length+" correct.");
  wire();
}

function wire(){
  const on=(id,fn)=>{const el=document.getElementById(id); if(el) el.onclick=fn;};
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>startStation(b.dataset.go));
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(!S.present)answer(b.dataset.opt);});
  on("next",advance); on("again",()=>startStation(S.station.id)); on("menu",renderMenu);
  on("wipe",()=>{ if(confirm("Clear your saved progress for this cabinet? This cannot be undone.")){
    Store.clear(); mem={v:1,rank:0,stations:{}}; renderMenu(); }});
}

document.addEventListener("keydown",e=>{
  if(!S.present||S.screen!=="play") return;
  if(e.key===" "||e.key==="ArrowRight"){e.preventDefault(); if(!S.answered)answer(null); else advance();}
  if(e.key==="ArrowLeft"){e.preventDefault(); if(S.idx>0){S.idx--;renderItem();}}
  if(e.key==="Escape"){e.preventDefault(); S.present=false; renderMenu();}
});

(function boot(){
  if(S.present){
    const st=stationById(params.get("station"))||BANK.stations[0];
    S.station=st; S.queue=st.items.slice();
    const want=params.get("item");
    const at=want?S.queue.findIndex(i=>i.id===want):0;
    S.idx=at>=0?at:0; S.missed=[]; S.near=[]; renderItem();
  } else renderMenu();
})();
</script>
</body>
</html>
