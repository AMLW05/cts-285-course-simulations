<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Memory Bank</title></head>
<body>
  <h1>Memory Bank: set-1</h1>
  {% if message %}<p><strong>{{ message }}</strong></p>{% endif %}
  <p>Set holds {{ members|length }}: {{ members|join(", ") }}</p>
  <form method="post">
    <label for="problem_id">Problem id to add (for example P11)</label>
    <input id="problem_id" name="problem_id" required>
    <button type="submit">Add</button>
  </form>
</body>
</html>
